name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build TodoExit.slnx -c Release

      - name: Test
        run: dotnet test TodoExit.slnx -c Release --no-build

      - name: Publish web app
        if: matrix.os == 'ubuntu-latest'
        run: dotnet publish src/TodoExit.Web -c Release -o artifacts/web
