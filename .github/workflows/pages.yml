name: Deploy web app to GitHub Pages

# Manual only: nothing deploys by itself while the repository is private.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish src/TodoExit.Web -c Release -o artifacts/web

      - name: Prepare for https://milanm.github.io/todo-exit/
        working-directory: artifacts/web/wwwroot
        run: |
          # The site lives under /todo-exit/, so the base href must say so.
          sed -i 's|<base href="/" />|<base href="/todo-exit/" />|' index.html
          grep -q '<base href="/todo-exit/" />' index.html
          # The precompressed copies still hold the old base href; Pages does not use them, so drop them.
          rm -f index.html.br index.html.gz
          # SPA fallback: /todo-exit/authentication/login-callback and other routes load the app.
          cp index.html 404.html
          # Serve folders that start with an underscore (_framework, _content) as they are.
          touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/web/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
